<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>د. سيارات | خبير الصيانة والبرمجة</title>
  <meta name="description" content="استشر د. سيارات - خبيرك الذكي المتخصص في صيانة وبرمجة السيارات. تشخيص دقيق وحلول احترافية." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0a0a0f;
      --bg-secondary: #0f1117;
      --bg-card: #13151f;
      --bg-input: #1a1d2e;
      --accent-orange: #f97316;
      --accent-amber: #f59e0b;
      --accent-red: #ef4444;
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #475569;
      --border: #1e2235;
      --border-glow: rgba(249, 115, 22, 0.3);
      --user-bubble: linear-gradient(135deg, #f97316, #ea580c);
      --bot-bubble: #16192a;
      --shadow-glow: 0 0 30px rgba(249, 115, 22, 0.15);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Tajawal', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Animated background */
    body::before {
      content: '';
      position: fixed;
      top: -50%;
      right: -50%;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, rgba(249,115,22,0.05) 0%, transparent 60%);
      animation: pulse-bg 8s ease-in-out infinite;
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: '';
      position: fixed;
      bottom: -50%;
      left: -50%;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, rgba(239,68,68,0.03) 0%, transparent 60%);
      animation: pulse-bg 10s ease-in-out infinite reverse;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes pulse-bg {
      0%, 100% { transform: scale(1); opacity: 0.5; }
      50% { transform: scale(1.2); opacity: 1; }
    }

    /* ====== HEADER ====== */
    .header {
      position: relative;
      z-index: 10;
      background: rgba(10, 10, 15, 0.9);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 70px;
      box-shadow: 0 4px 30px rgba(0,0,0,0.5);
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo-circle {
      width: 46px;
      height: 46px;
      background: linear-gradient(135deg, var(--accent-orange), var(--accent-red));
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      box-shadow: 0 0 20px rgba(249,115,22,0.4);
      animation: logo-pulse 3s ease-in-out infinite;
    }

    @keyframes logo-pulse {
      0%, 100% { box-shadow: 0 0 20px rgba(249,115,22,0.4); }
      50% { box-shadow: 0 0 35px rgba(249,115,22,0.7); }
    }

    .brand-text h1 {
      font-size: 18px;
      font-weight: 800;
      color: var(--text-primary);
      line-height: 1.1;
    }

    .brand-text span {
      font-size: 12px;
      color: var(--accent-orange);
      font-weight: 500;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.2);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 13px;
      color: #10b981;
      font-weight: 500;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: #10b981;
      border-radius: 50%;
      animation: blink 2s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* ====== MAIN LAYOUT ====== */
    .main {
      position: relative;
      z-index: 5;
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 900px;
      margin: 0 auto;
      width: 100%;
      padding: 0 16px;
      overflow: hidden;
    }

    /* ====== CHAT AREA ====== */
    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 24px 0;
      display: flex;
      flex-direction: column;
      gap: 20px;
      scroll-behavior: smooth;
    }

    .chat-container::-webkit-scrollbar {
      width: 4px;
    }

    .chat-container::-webkit-scrollbar-track {
      background: transparent;
    }

    .chat-container::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 10px;
    }

    /* ====== WELCOME SCREEN ====== */
    .welcome-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
      gap: 24px;
      animation: fadeInUp 0.8s ease;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .welcome-icon {
      width: 100px;
      height: 100px;
      background: linear-gradient(135deg, #1a1d2e, #0f1117);
      border: 2px solid var(--accent-orange);
      border-radius: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      box-shadow: var(--shadow-glow);
      animation: float 4s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .welcome-title {
      font-size: 32px;
      font-weight: 900;
      background: linear-gradient(135deg, var(--accent-orange), var(--accent-amber));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .welcome-subtitle {
      font-size: 16px;
      color: var(--text-secondary);
      max-width: 400px;
      line-height: 1.7;
    }

    .quick-questions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      width: 100%;
      max-width: 600px;
    }

    .quick-btn {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      color: var(--text-secondary);
      font-family: 'Tajawal', sans-serif;
      font-size: 14px;
      cursor: pointer;
      text-align: right;
      transition: all 0.3s ease;
      line-height: 1.5;
    }

    .quick-btn:hover {
      border-color: var(--accent-orange);
      color: var(--text-primary);
      background: rgba(249, 115, 22, 0.08);
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(249,115,22,0.1);
    }

    .quick-btn .q-icon {
      font-size: 18px;
      display: block;
      margin-bottom: 6px;
    }

    /* ====== MESSAGES ====== */
    .message {
      display: flex;
      gap: 12px;
      animation: messageIn 0.4s ease;
    }

    @keyframes messageIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      flex-direction: row-reverse;
    }

    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
      margin-top: 4px;
    }

    .message.bot .avatar {
      background: linear-gradient(135deg, #1a1d2e, #0f1117);
      border: 1px solid var(--accent-orange);
    }

    .message.user .avatar {
      background: linear-gradient(135deg, var(--accent-orange), var(--accent-red));
    }

    .bubble {
      max-width: 75%;
      padding: 14px 18px;
      border-radius: 18px;
      line-height: 1.8;
      font-size: 15px;
    }

    .message.bot .bubble {
      background: var(--bot-bubble);
      border: 1px solid var(--border);
      border-radius: 4px 18px 18px 18px;
      color: var(--text-primary);
    }

    .message.user .bubble {
      background: var(--user-bubble);
      border-radius: 18px 4px 18px 18px;
      color: white;
      font-weight: 500;
    }

    /* Typing indicator */
    .typing-indicator {
      display: flex;
      gap: 5px;
      padding: 16px 18px;
      background: var(--bot-bubble);
      border: 1px solid var(--border);
      border-radius: 4px 18px 18px 18px;
      width: fit-content;
    }

    .typing-dot {
      width: 8px;
      height: 8px;
      background: var(--accent-orange);
      border-radius: 50%;
      animation: typingBounce 1.4s ease-in-out infinite;
    }

    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes typingBounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
      30% { transform: translateY(-8px); opacity: 1; }
    }

    /* ====== INPUT AREA ====== */
    .input-area {
      padding: 16px 0 24px;
      position: relative;
    }

    .input-wrapper {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 12px 16px;
      transition: all 0.3s ease;
    }

    .input-wrapper:focus-within {
      border-color: var(--accent-orange);
      box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.1);
    }

    #userInput {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: var(--text-primary);
      font-family: 'Tajawal', sans-serif;
      font-size: 15px;
      resize: none;
      max-height: 120px;
      min-height: 24px;
      line-height: 1.6;
      direction: rtl;
    }

    #userInput::placeholder {
      color: var(--text-muted);
    }

    #sendBtn {
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, var(--accent-orange), var(--accent-red));
      border: none;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      flex-shrink: 0;
      box-shadow: 0 4px 15px rgba(249,115,22,0.3);
    }

    #sendBtn:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 20px rgba(249,115,22,0.5);
    }

    #sendBtn:active {
      transform: scale(0.95);
    }

    #sendBtn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    #sendBtn svg {
      width: 20px;
      height: 20px;
      fill: white;
    }

    .input-hint {
      text-align: center;
      color: var(--text-muted);
      font-size: 12px;
      margin-top: 10px;
    }

    /* ====== ERROR MESSAGE ====== */
    .error-bubble {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 12px;
      padding: 12px 16px;
      color: #fca5a5;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Formatted bot response */
    .bubble strong {
      color: var(--accent-amber);
    }

    .bubble code {
      background: rgba(249,115,22,0.1);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
      color: var(--accent-orange);
      font-size: 13px;
    }

    /* Responsive */
    @media (max-width: 600px) {
      .quick-questions {
        grid-template-columns: 1fr;
      }
      .bubble {
        max-width: 88%;
      }
      .welcome-title {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <div class="header-brand">
      <div class="logo-circle">🔧</div>
      <div class="brand-text">
        <h1>د. سيارات</h1>
        <span>خبير الصيانة والبرمجة</span>
      </div>
    </div>
    <div class="status-badge">
      <div class="status-dot"></div>
      متصل الآن
    </div>
  </header>

  <!-- MAIN -->
  <main class="main">
    <div class="chat-container" id="chatContainer">

      <!-- WELCOME -->
      <div class="welcome-screen" id="welcomeScreen">
        <div class="welcome-icon">🚗</div>
        <div>
          <h2 class="welcome-title">مرحباً بك مع د. سيارات</h2>
          <p class="welcome-subtitle">
            خبيرك الذكي في تشخيص وصيانة وبرمجة السيارات.<br>
            اسألني عن أي عطل أو استفسار تقني!
          </p>
        </div>

        <div class="quick-questions">
          <button class="quick-btn" onclick="sendQuick(this)">
            <span class="q-icon">⚠️</span>
            إضاءة Check Engine لا تطفأ، ما السبب؟
          </button>
          <button class="quick-btn" onclick="sendQuick(this)">
            <span class="q-icon">🔋</span>
            البطارية تفرغ بسرعة، هل المشكلة في الـ Alternator؟
          </button>
          <button class="quick-btn" onclick="sendQuick(this)">
            <span class="q-icon">💨</span>
            السيارة تهتز عند التسارع، ما سبب المشكلة؟
          </button>
          <button class="quick-btn" onclick="sendQuick(this)">
            <span class="q-icon">🌡️</span>
            الـ ECU يعطي كود P0300 ماذا يعني؟
          </button>
        </div>
      </div>

    </div>

    <!-- INPUT -->
    <div class="input-area">
      <div class="input-wrapper">
        <button id="sendBtn" onclick="sendMessage()" title="إرسال">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
          </svg>
        </button>
        <textarea
          id="userInput"
          placeholder="اسألني عن أي عطل أو مشكلة في سيارتك..."
          rows="1"
          onkeydown="handleKeyDown(event)"
          oninput="autoResize(this)"
        ></textarea>
      </div>
      <p class="input-hint">اضغط Enter للإرسال • Shift+Enter لسطر جديد</p>
    </div>
  </main>

  <script>
    let conversationHistory = [];
    let isLoading = false;

    const chatContainer = document.getElementById('chatContainer');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const welcomeScreen = document.getElementById('welcomeScreen');

    function autoResize(textarea) {
      textarea.style.height = 'auto';
      textarea.style.height = Math.min(textarea.scrollHeight, 120) + 'px';
    }

    function handleKeyDown(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    function sendQuick(btn) {
      const text = btn.innerText.trim().replace(/^[^\w\u0600-\u06FF]+/, '').trim();
      userInput.value = text;
      sendMessage();
    }

    function hideWelcome() {
      if (welcomeScreen) {
        welcomeScreen.style.display = 'none';
      }
    }

    function addMessage(role, content) {
      hideWelcome();

      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${role}`;

      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      avatar.textContent = role === 'user' ? '👤' : '🔧';

      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.innerHTML = formatMessage(content);

      msgDiv.appendChild(avatar);
      msgDiv.appendChild(bubble);
      chatContainer.appendChild(msgDiv);
      scrollToBottom();
      return msgDiv;
    }

    function formatMessage(text) {
      // Format code-like terms in orange
      text = text.replace(/\b([A-Z][A-Z0-9\-]{1,20})\b/g, '<code>$1</code>');
      // Bold Arabic emphasis
      text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
      // Newlines
      text = text.replace(/\n/g, '<br>');
      return text;
    }

    function addTypingIndicator() {
      hideWelcome();
      const msgDiv = document.createElement('div');
      msgDiv.className = 'message bot';
      msgDiv.id = 'typingIndicator';

      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      avatar.textContent = '🔧';

      const indicator = document.createElement('div');
      indicator.className = 'typing-indicator';
      indicator.innerHTML = `
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
      `;

      msgDiv.appendChild(avatar);
      msgDiv.appendChild(indicator);
      chatContainer.appendChild(msgDiv);
      scrollToBottom();
    }

    function removeTypingIndicator() {
      const indicator = document.getElementById('typingIndicator');
      if (indicator) indicator.remove();
    }

    function scrollToBottom() {
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    async function sendMessage() {
      if (isLoading) return;

      const text = userInput.value.trim();
      if (!text) return;

      // Clear input
      userInput.value = '';
      userInput.style.height = 'auto';

      // Add user message
      addMessage('user', text);
      conversationHistory.push({ role: 'user', content: text });

      // Show typing
      isLoading = true;
      sendBtn.disabled = true;
      addTypingIndicator();

      try {
        const response = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: conversationHistory })
        });

        const data = await response.json();
        removeTypingIndicator();

        if (data.status === 'success' && data.reply) {
          addMessage('bot', data.reply);
          conversationHistory.push({ role: 'assistant', content: data.reply });
        } else {
          showError(data.error || 'حدث خطأ في الاتصال');
        }

      } catch (err) {
        removeTypingIndicator();
        showError('تعذّر الاتصال بالخادم. تحقق من الإنترنت.');
      } finally {
        isLoading = false;
        sendBtn.disabled = false;
        userInput.focus();
      }
    }

    function showError(msg) {
      const errDiv = document.createElement('div');
      errDiv.className = 'error-bubble';
      errDiv.innerHTML = `⚠️ ${msg}`;
      chatContainer.appendChild(errDiv);
      scrollToBottom();
    }

    // Focus on load
    window.addEventListener('load', () => {
      userInput.focus();
    });
  </script>

</body>
</html>
